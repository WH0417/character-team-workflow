<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="996" viewBox="0 0 560 996" role="img" aria-label="流程图渲染器验证 &lt;SVG &amp; PNG&gt;">
<title>流程图渲染器验证 &lt;SVG &amp; PNG&gt;</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62758a"/></marker></defs>
<rect width="100%" height="100%" fill="#f3f6fa"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="36" y="45" fill="#203246" font-size="28" font-weight="700" text-anchor="start"><tspan x="36" dy="0">流程图渲染器验证 &lt;SVG &amp; PNG&gt;</tspan></text>
<rect x="24" y="94" width="512" height="446" rx="18" fill="#ffffff" stroke="#d8e1ea"/>
<text x="48" y="127" fill="#174b7b" font-size="19" font-weight="700" text-anchor="start"><tspan x="48" dy="0">一、讨论与汇总</tspan></text>
<g transform="translate(150 148)">
<path d="M 130 64 V 100.5 H 130 V 137" fill="none" stroke="#62758a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 130 204 V 240.5 H 130 V 277" fill="none" stroke="#62758a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="40" y="0" width="180" height="64" rx="11" fill="#eaf4ff" stroke="#3178bb" stroke-width="1.6"/>
<text x="130" y="37" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="130" dy="0">提出问题与目标</tspan></text>
<rect x="40" y="140" width="180" height="64" rx="11" fill="#eaf4ff" stroke="#3178bb" stroke-width="1.6"/>
<text x="130" y="167" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="130" dy="0">多个角色独立分析</tspan><tspan x="130" dy="20">交换证据与观点</tspan></text>
<rect x="40" y="280" width="180" height="64" rx="11" fill="#eaf4ff" stroke="#3178bb" stroke-width="1.6"/>
<text x="130" y="317" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="130" dy="0">形成可执行的共同结论</tspan></text>
<rect x="137" y="79.5" width="36" height="20" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="142" y="92.5" fill="#45596d" font-size="12" font-weight="400" text-anchor="start"><tspan x="142" dy="0">开始</tspan></text>
<rect x="137" y="219.5" width="36" height="20" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="142" y="232.5" fill="#45596d" font-size="12" font-weight="400" text-anchor="start"><tspan x="142" dy="0">汇总</tspan></text>
</g>
<rect x="24" y="564" width="512" height="166" rx="18" fill="#ffffff" stroke="#d8e1ea"/>
<text x="48" y="597" fill="#205e48" font-size="19" font-weight="700" text-anchor="start"><tspan x="48" dy="0">二、并行检查</tspan></text>
<g transform="translate(24 618)">
<path d="M 220 32 H 254.5 V 32 H 289" fill="none" stroke="#62758a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="0" width="180" height="64" rx="11" fill="#eaf7f0" stroke="#328065" stroke-width="1.6"/>
<text x="130" y="37" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="130" dy="0">检查约束与边界</tspan></text>
<rect x="292" y="0" width="180" height="64" rx="11" fill="#eaf7f0" stroke="#328065" stroke-width="1.6"/>
<text x="382" y="37" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="382" dy="0">验证结果</tspan></text>
</g>
<rect x="24" y="754" width="512" height="166" rx="18" fill="#ffffff" stroke="#d8e1ea"/>
<text x="48" y="787" fill="#805018" font-size="19" font-weight="700" text-anchor="start"><tspan x="48" dy="0">三、交付</tspan></text>
<g transform="translate(150 808)">
<rect x="40" y="0" width="180" height="64" rx="11" fill="#fff3e4" stroke="#b87528" stroke-width="1.6"/>
<text x="130" y="37" fill="#203246" font-size="14" font-weight="500" text-anchor="middle"><tspan x="130" dy="0">保存 SVG / PNG</tspan></text>
</g>
<text x="36" y="946" fill="#5e6f81" font-size="13" font-weight="400" text-anchor="start"><tspan x="36" dy="0">支持中文自动换行、显式换行、虚线、箭头与 XML 特殊字符转义。</tspan></text></g>
</svg>
